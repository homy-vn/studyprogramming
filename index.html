    cpp:{label:'C++',variable:'int age = 18;\nstring name = "An";\nbool isLearning = true;',condition:'if (score >= 5) {\n    cout << "Đạt";\n} else {\n    cout << "Cần cố gắng";\n}',loop:'for (int i = 0; i < 5; i++) {\n    cout << i << endl;\n}',function:'int add(int a, int b) {\n    return a + b;\n}',sort:'sort(numbers.begin(), numbers.end());',search:'auto it = find(numbers.begin(), numbers.end(), target);',class:'class Dog {\npublic:\n    string name;\n    void bark() { cout << "Gâu!"; }\n};'},
    csharp:{label:'C#',variable:'int age = 18;\nstring name = "An";\nbool isLearning = true;',condition:'if (score >= 5) {\n    Console.WriteLine("Đạt");\n} else {\n    Console.WriteLine("Cần cố gắng");\n}',loop:'for (int i = 0; i < 5; i++) {\n    Console.WriteLine(i);\n}',function:'static int Add(int a, int b) {\n    return a + b;\n}',sort:'Array.Sort(numbers);',search:'int index = Array.BinarySearch(numbers, target);',class:'class Dog {\n    public string Name { get; set; }\n    public void Bark() { Console.WriteLine("Gâu!"); }\n}'}
  };
  const fundamentals=[['Biến','Biến là một vùng nhớ được đặt tên, dùng để lưu giá trị mà chương trình có thể đọc hoặc thay đổi. Hãy chọn tên dễ hiểu và phù hợp quy tắc của ngôn ngữ.','variable'],['Kiểu dữ liệu','Kiểu dữ liệu xác định loại giá trị được lưu trữ và những phép toán có thể thực hiện. Ví dụ phổ biến: số nguyên, số thực, chuỗi ký tự và boolean.','variable'],['Cấu trúc điều kiện','Câu lệnh điều kiện cho phép chương trình chọn nhánh thực thi dựa trên một biểu thức đúng hoặc sai.','condition'],['Vòng lặp','Vòng lặp giúp thực hiện lại một khối lệnh. Dùng for khi biết số lượt lặp, while khi lặp theo điều kiện; nhớ cập nhật điều kiện để tránh lặp vô hạn.','loop'],['Hàm','Hàm là khối lệnh có tên để tái sử dụng. Hàm có thể nhận tham số đầu vào và trả về kết quả; nên tách mỗi hàm theo một nhiệm vụ rõ ràng.','function']];
  function codeBlock(key){let e=examples[selectedLanguage];return `<div class="codebox"><div class="code-head"><span>${e.label} · ví dụ</span><button onclick="copyCode(this)">Sao chép</button></div><pre>${escapeHtml(e[key]||'// Chưa có ví dụ cho chủ đề này')}</pre></div>`}
  function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
  function setPage(page){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('breadcrumb').textContent=page==='home'?'Tổng quan':(pages[page]?.title||'Tổng quan');document.getElementById('sidebar').classList.remove('open');page==='home'?renderHome():renderPage(page);window.scrollTo({top:0,behavior:'smooth'})}
  function renderHome(){document.getElementById('content').innerHTML=`<section class="hero"><div class="eyebrow">Không gian học lập trình</div><h1>Biến ý tưởng thành<br>những dòng code đầu tiên.</h1><p>Học lập trình bài bản, từ kiến thức nền tảng đến thuật toán và cấu trúc dữ liệu — theo ngôn ngữ bạn yêu thích.</p><div class="hero-actions"><button class="primary-btn" onclick="setPage('foundation')">Bắt đầu học <span>↗</span></button><button class="secondary-btn" onclick="setPage('sorting')">Khám phá thuật toán</button></div></section><div class="section-heading"><div><h2>Chọn ngôn ngữ của bạn</h2><p>Ví dụ code sẽ tự cập nhật theo lựa chọn của bạn.</p></div><span class="text-link">${examples[selectedLanguage].label} đã chọn ✓</span></div><div class="language-grid">${languages.map(l=>`<button class="language-card ${selectedLanguage===l.id?'selected':''}" onclick="selectLanguage('${l.id}')"><span class="check">✓</span><span class="lang-mark" style="background:${l.bg};color:${l.color}">${l.mark}</span><div class="lang-name">${l.name}</div><div class="lang-sub">${l.sub}</div></button>`).join('')}</div><div class="section-heading"><div><h2>Tiến độ của bạn</h2><p>Mỗi bước nhỏ đưa bạn đến gần mục tiêu hơn.</p></div></div><div class="overview-grid"><div class="progress-card"><div class="card-kicker"><strong>Lộ trình học tập</strong><span>Đang khởi hành</span></div><div class="progress-row"><div class="progress-ring"><span>12%</span></div><div class="progress-copy"><strong>Khởi đầu thật tốt!</strong><p>Hoàn thành bài đầu tiên để theo dõi tiến độ học.</p></div></div></div><div class="streak-card"><div class="card-kicker"><strong>Chuỗi học tập 🔥</strong><span>Tuần này</span></div><div class="streak-number">0 <small>ngày</small></div><div class="streak-copy">Dành 10 phút hôm nay để bắt đầu chuỗi.</div><div class="streak-days"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div></div></div><div class="section-heading"><div><h2>Khám phá kiến thức</h2><p>Chọn chủ đề để bắt đầu hành trình của bạn.</p></div><button class="text-link" onclick="setPage('foundation')">Xem lộ trình →</button></div><div class="learning-grid">${Object.entries(pages).filter(([k])=>k!=='cheatsheet').map(([key,p])=>`<article class="topic-card" onclick="setPage('${key}')"><div class="topic-card-top"><span class="topic-icon">${p.icon}</span><span class="topic-tag">${p.tag}</span></div><h3>${p.title}</h3><p>${p.intro}</p><span class="topic-arrow">↗</span></article>`).join('')}</div><div class="path-card"><div class="path-title"><strong>Lộ trình gợi ý</strong><span>Học theo thứ tự để vững nền tảng</span></div><div class="path-steps"><span class="step"><b>1</b>Nền tảng</span><i class="step-line"></i><span class="step"><b>2</b>Cấu trúc dữ liệu</span><i class="step-line"></i><span class="step"><b>3</b>Thuật toán</span><i class="step-line"></i><span class="step"><b>4</b>Hướng đối tượng</span></div></div>`}
  function renderPage(key){const p=pages[key];if(!p){renderHome();return}let isFoundation=key==='foundation',isCheat=key==='cheatsheet';let topics=p.topics;let cards=topics.map((t,i)=>`<article class="topic-card" onclick="openLesson('${key}',${i})"><div class="topic-card-top"><span class="topic-icon">${t[0]}</span><span class="topic-tag">${p.tag}</span></div><h3>${t[1]}</h3><p>${t[2]}</p><span class="topic-arrow">↗</span></article>`).join('');document.getElementById('content').innerHTML=`<div class="eyebrow">Lộ trình học tập · ${p.tag}</div><h1 class="page-title">${p.title}</h1><p class="page-intro">${p.intro}</p>${isFoundation?`<div class="callout" style="margin-bottom:18px"><strong>Ngôn ngữ hiện tại: ${examples[selectedLanguage].label}.</strong> Chọn ngôn ngữ khác ở trang Tổng quan để đổi ví dụ code.</div>`:''}<div class="learning-grid">${cards}</div>${isCheat?`<div class="section-heading"><div><h2>Ví dụ cú pháp · ${examples[selectedLanguage].label}</h2><p>Những mẫu lệnh thường dùng trong chương trình.</p></div></div><div class="lesson-block"><h2>Khai báo biến</h2>${codeBlock('variable')}</div><div class="lesson-block"><h2>Điều kiện</h2>${codeBlock('condition')}</div><div class="lesson-block"><h2>Vòng lặp</h2>${codeBlock('loop')}</div><div class="lesson-block"><h2>Hàm</h2>${codeBlock('function')}</div>`:''}`}
  function openLesson(section,index){let p=pages[section],t=p.topics[index];let topicName=t[1];let fundamental=fundamentals.find(x=>x[0]===topicName);let body='';let code='';if(fundamental){body=`<p>${fundamental[1]}</p>`;code=codeBlock(fundamental[2]);if(topicName==='Kiểu dữ liệu')body+=`<ul><li><b>Số nguyên:</b> dùng cho số đếm như tuổi, số lượng.</li><li><b>Số thực:</b> dùng cho giá trị thập phân như điểm số.</li><li><b>Chuỗi:</b> lưu văn bản; <b>boolean:</b> biểu diễn đúng hoặc sai.</li></ul>`;if(topicName==='Biến')body+=`<div class="callout"><strong>Mẹo:</strong> Tên biến nên mô tả giá trị, ví dụ <code>studentName</code> thay vì <code>x</code>.</div>`;if(topicName==='Vòng lặp')body+=`<div class="callout"><strong>Lưu ý:</strong> Kiểm tra điều kiện dừng để tránh vòng lặp vô hạn.</div>`;}
    else if(section==='sorting'){body=`<p>${t[2]}</p><p>Thuật toán sắp xếp nhận một tập hợp dữ liệu và sắp xếp các phần tử theo thứ tự. Khi lựa chọn, hãy xem xét kích thước dữ liệu, độ phức tạp và yêu cầu về bộ nhớ.</p><h2>Ý tưởng</h2><ul><li>Xác định thứ tự cần sắp xếp (tăng dần hoặc giảm dần).</li><li>So sánh và di chuyển phần tử theo quy tắc của thuật toán.</li><li>Kiểm tra kết quả sau khi hoàn tất.</li></ul><p><b>Độ phức tạp tham khảo:</b> Bubble, Selection, Insertion thường chạy O(n²); Merge Sort chạy O(n log n); Quick Sort trung bình O(n log n).</p>`;code=codeBlock('sort');}
    else if(section==='searching'){body=`<p>${t[2]}</p><p>Trước khi chọn thuật toán, hãy xác định dữ liệu đã được sắp xếp chưa và bạn cần tìm một hay nhiều kết quả.</p><h2>Khi nào nên dùng?</h2><ul><li><b>Tuyến tính:</b> dữ liệu nhỏ hoặc chưa sắp xếp, độ phức tạp O(n).</li><li><b>Nhị phân:</b> dữ liệu đã sắp xếp, độ phức tạp O(log n).</li><li>Luôn xử lý trường hợp không tìm thấy phần tử.</li></ul>`;code=codeBlock('search');}
    else if(section==='oop'){body=`<p>${t[2]}</p><p>Trong OOP, lớp (class) mô tả thuộc tính và hành vi; đối tượng (object) là một thực thể cụ thể được tạo từ lớp. Bốn nguyên lý chính gồm đóng gói, kế thừa, đa hình và trừu tượng.</p><h2>Ví dụ lớp và đối tượng</h2><ul><li><b>Lớp:</b> bản thiết kế mô tả đối tượng.</li><li><b>Thuộc tính:</b> dữ liệu của đối tượng, như tên hoặc màu sắc.</li><li><b>Phương thức:</b> hành động đối tượng có thể thực hiện.</li></ul>`;code=codeBlock('class');}
    else{body=`<p>${t[2]}</p><p>Đây là một khái niệm quan trọng trong cấu trúc dữ liệu. Hãy tìm hiểu cách dữ liệu được tổ chức, thao tác cơ bản và trường hợp sử dụng phù hợp.</p><h2>Điểm cần nhớ</h2><ul><li>Xác định thao tác thường dùng: truy cập, thêm, xóa hoặc tìm kiếm.</li><li>Chọn cấu trúc phù hợp với mục tiêu và kích thước dữ liệu.</li><li>Ước lượng chi phí thời gian và bộ nhớ.</li></ul>`;code=codeBlock('variable')}
    document.getElementById('breadcrumb').textContent=topicName;document.getElementById('content').innerHTML=`<button class="text-link" onclick="setPage('${section}')" style="margin-bottom:16px;padding:0">← Quay lại ${p.title}</button><div class="eyebrow">${p.title} · Bài học</div><h1 class="page-title">${topicName}</h1><p class="page-intro">${t[2]}</p><div class="lesson-layout"><div class="lesson-main"><section class="lesson-block"><h2>Khái niệm</h2>${body}</section><section class="lesson-block"><h2>Ví dụ với ${examples[selectedLanguage].label}</h2><p>Tham khảo cú pháp cơ bản dưới đây. Hãy thử thay đổi giá trị và quan sát kết quả.</p>${code}<div class="callout"><strong>Thử thách:</strong> Tự viết một ví dụ tương tự và thay đổi dữ liệu đầu vào.</div></section><section class="lesson-block"><h2>Ghi nhớ</h2><p>Hiểu cách hoạt động trước khi học thuộc cú pháp. Thực hành bằng những ví dụ nhỏ sẽ giúp bạn ghi nhớ lâu hơn.</p><button class="primary-btn" onclick="showToast('Đã đánh dấu bài học hoàn thành!')">Đánh dấu hoàn thành ✓</button></section></div><aside class="lesson-aside"><strong>Trong bài học này</strong><button onclick="document.querySelector('.lesson-main').scrollIntoView({behavior:'smooth'})">01 &nbsp; Khái niệm</button><button onclick="document.querySelectorAll('.lesson-block')[1].scrollIntoView({behavior:'smooth'})">02 &nbsp; Ví dụ code</button><button onclick="document.querySelectorAll('.lesson-block')[2].scrollIntoView({behavior:'smooth'})">03 &nbsp; Ghi nhớ</button></aside></div>`;window.scrollTo({top:0,behavior:'smooth'})}
  function selectLanguage(id){selectedLanguage=id;renderHome();showToast(`Đã chọn ${examples[id].label}`)}
  function copyCode(button){const text=button.parentElement.nextElementSibling.innerText;navigator.clipboard?.writeText(text).then(()=>showToast('Đã sao chép code!')).catch(()=>showToast('Không thể sao chép trên trình duyệt này.'))}
  let toastTimer;function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}
  document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();setPage('home')});renderHome();
</script>
</body>
